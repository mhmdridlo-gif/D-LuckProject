<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Luck Project Controller</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        /* LOADING SCREEN - Desain Futuristik / Neon D'Luck */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #090c10; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
            transition: opacity 0.6s ease;
        }
        .loader-logo-img {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), 0 0 50px rgba(255, 0, 127, 0.4);
            border: 2px solid #00f3ff; margin-bottom: 25px;
            animation: pulseGlow 2s infinite alternate;
        }
        .loader-title {
            font-size: 26px; font-weight: bold; background: linear-gradient(45deg, #00f3ff, #ff007f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.4); margin-bottom: 15px;
            letter-spacing: 2px; text-align: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #ff007f; border-radius: 50%;
            animation: spin 0.8s linear infinite; box-shadow: 0 0 10px #ff007f;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
            100% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 0, 127, 0.8); }
        }

        /* MAIN APP CONTAINER */
        #app-container {
            width: 100%; max-width: 420px; height: 100%; max-height: 850px;
            background: #161b22; display: flex; flex-direction: column;
            border-radius: 24px; box-shadow: 0 0 40px rgba(0,0,0,0.9);
            border: 1px solid #30363d; overflow: hidden; display: none;
        }
        header {
            padding: 18px; text-align: center; background: #21262d;
            border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        header img { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #00f3ff; }
        header h1 {
            font-size: 18px; background: linear-gradient(45deg, #00f3ff, #ff007f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .content { padding: 18px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        
        .card {
            background: #21262d; padding: 16px; border-radius: 14px;
            border: 1px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .card h3 { font-size: 13px; margin-bottom: 10px; color: #8b949e; letter-spacing: 0.5px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            padding: 12px; border: none; border-radius: 10px; font-weight: bold;
            cursor: pointer; transition: 0.2s; color: #fff; font-size: 13px;
        }
        .btn-cyan { background: linear-gradient(135deg, #00f3ff, #0077ff); box-shadow: 0 0 12px rgba(0,243,255,0.3); }
        .btn-pink { background: linear-gradient(135deg, #ff007f, #7f00ff); box-shadow: 0 0 12px rgba(255,0,127,0.3); }
        button:active { transform: scale(0.96); opacity: 0.9; }

        .status-box {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; color: #8b949e; margin-bottom: 10px;
        }
        .indicator { width: 10px; height: 10px; background: #ff5555; border-radius: 50%; box-shadow: 0 0 8px #ff5555; }
        .indicator.connected { background: #55ff55; box-shadow: 0 0 8px #55ff55; }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <img src="logo.jpg" alt="D'Luck Logo" class="loader-logo-img">
        <div class="loader-title">D'LUCK PROJECT</div>
        <div class="spinner"></div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container">
        <header>
            <img src="logo.jpg" alt="Logo">
            <h1>D'LUCK CONTROLLER</h1>
        </header>
        <div class="content">
            <!-- KONEKSI BLUETOOTH ESP32-C3 -->
            <div class="card">
                <h3>KONEKSI BLUETOOTH ESP32-C3</h3>
                <div class="status-box">
                    <span>Status: <strong id="conn-status" style="color:#ff5555;">Terputus</strong></span>
                    <div id="indicator" class="indicator"></div>
                </div>
                <button class="btn-cyan" style="width: 100%;" onclick="connectBluetooth()">Cari & Hubungkan Perangkat</button>
            </div>

            <!-- KONTROL LAMPU UTAMA -->
            <div class="card">
                <h3>KONTROL UTAMA (ON / OFF)</h3>
                <div class="btn-grid">
                    <button class="btn-cyan" onclick="sendBLE('ON')">NYALAKAN</button>
                    <button class="btn-pink" onclick="sendBLE('OFF')">MATIKAN</button>
                </div>
            </div>

            <!-- MODE RUNNING / ANIMASI ALIS -->
            <div class="card">
                <h3>MODE ANIMASI LAMPU</h3>
                <div class="btn-grid">
                    <button class="btn-cyan" onclick="sendBLE('MODE_1')">Running Alis 1</button>
                    <button class="btn-pink" onclick="sendBLE('MODE_2')">Running Alis 2</button>
                    <button class="btn-cyan" onclick="sendBLE('MODE_3')">Dual Color Belang</button>
                    <button class="btn-pink" onclick="sendBLE('MODE_4')">Static Neon</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulasi Loading Screen (Durasi 2.5 detik sesuai estetika desain)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                }, 600);
            }, 2500);
        });

        // Variabel Bluetooth Low Energy (BLE)
        let bluetoothDevice;
        let bluetoothCharacteristic;

        // Fungsi Menghubungkan ESP32-C3 via Bluetooth
        async function connectBluetooth() {
            try {
                const statusEl = document.getElementById('conn-status');
                const indicatorEl = document.getElementById('indicator');

                statusEl.innerText = "Mencari...";
                
                // Meminta perangkat BLE (sesuaikan nama atau service UUID ESP32 Anda jika perlu)
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b'] // UUID Service standar ESP32 BLE
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
                bluetoothCharacteristic = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');

                statusEl.innerText = "Terhubung (" + device.name + ")";
                statusEl.style.color = "#55ff55";
                indicatorEl.classList.add('connected');
                alert("Berhasil terhubung ke ESP32-C3!");

            } catch (error) {
                console.error("Gagal koneksi Bluetooth:", error);
                document.getElementById('conn-status').innerText = "Gagal Terhubung";
                alert("Koneksi Bluetooth dibatalkan atau gagal: " + error);
            }
        }

        // Fungsi Mengirim Perintah ke ESP32-C3 via Bluetooth
        async function sendBLE(command) {
            if (!bluetoothCharacteristic) {
                alert("Perangkat ESP32 belum terhubung via Bluetooth!");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(command));
                console.log("Perintah terkirim:", command);
            } catch (error) {
                console.error("Gagal mengirim data:", error);
                alert("Gagal mengirim perintah.");
            }
        }

        // Registrasi Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
